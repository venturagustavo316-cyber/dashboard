<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Flin Flow</title>
  </head>
  <body>
    <header class="cabecalho">
      <a class="logo" href="index.html"
        ><img src="/images/logo-completa.svg" alt="logo finflow"
      /></a>
    </header>
    <nav class="menu">
      <a href="overview.html">Overview</a>
      <a href="transitions.html">Transitions</a>
      <a href="allexpence.html">All Expence</a>
      <a href="upcomingpay.html">Upcoming payments</a>
      <a href="savinggoals.html">Saving goals</a>
      <div class="search-notific">
        <button class="search">
          <img src="/icons/search-button.svg" alt="search-button" />
        </button>
        <button class="notification">
          <img src="/icons/notification-button.svg" alt="notification-button" />
        </button>
      </div>
    </nav>
    <div class="app-layout">
      <aside class="side-bar">
        <button class="button-home">
          <img src="/icons/home-button.svg" alt="button-home" />
        </button>
        <button class="deposit">
          <img src="/icons/deposit-button.svg" alt="deposit-button" />
        </button>
      </aside>
      <main>
      <section class="cards-information">
        <h1>Overview</h1>

        <div class="card">
          <span> Balance </span>
          <strong id="balance"> R$ 0,00 </strong>
        </div>

        <div class="card">
          <span> Income </span>
          <strong id="income"> R$ 0,00 </strong>
        </div>

        <div class="card">
          <span> Expenses </span>
          <strong id="expenses"> R$ 0,00 </strong>
        </div>
      </section>

      <section class="graphic">
        <h2>Overview Financial</h2>

        <div id="area-graphic"></div>
      </section>

      <section class="move">
        <h2>financial transaction</h2>

        <div id="transaction-list"></div>
      </section>

      <button id="btn-add">Add Transaction</button>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
