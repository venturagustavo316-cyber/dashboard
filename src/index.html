<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Flin Flow</title>
  </head>
  <body>
    <header class="cabecalho">
      <a class="logo" href="index.html"
        ><img src="/images/logo-completa.svg" alt="logo finflow"
      /></a>
    </header>
    <nav class="menu">
      <a href="index.html">Overview</a>
      <a href="transitions.html">Transitions</a>
      <a href="allexpence.html">All Expenses</a>
      <a href="upcomingpay.html">Upcoming payments</a>
      <a href="savinggoals.html">Saving goals</a>
      <div class="search-notific">
        <button class="search">
          <img src="/icons/search-button.svg" alt="search-button" />
        </button>
        <button class="notification">
          <img src="/icons/notification-button.svg" alt="notification-button" />
        </button>
      </div>
    </nav>
    <div class="app-layout">
      <aside class="side-bar">
        <button class="button-home">
          <img src="/icons/home-button.svg" alt="button-home" />
        </button>
        <button class="deposit">
          <img src="/icons/deposit-button.svg" alt="deposit-button" />
        </button>
      </aside>
      <main>
      <section class="cards-information">
        <h1>Overview</h1>

        <div class="card">
          <span> Balance </span>
          <strong id="balance"> R$ 0,00 </strong>
        </div>

        <div class="card">
          <span> Income </span>
          <strong id="income"> R$ 0,00 </strong>
        </div>

        <div class="card">
          <span> Expenses </span>
          <strong id="expenses"> R$ 0,00 </strong>
        </div>
      </section>

      <section class="graphic">
        <h2>Overview Financial</h2>

        <div id="area-graphic"></div>
      </section>

      <section class="move">
        <h2>Recent transactions</h2>

        <div id="transaction-list"></div>
      </section>

      <p id="app-message" role="status" aria-live="polite"></p>
      <button id="btn-add" type="button">Add Transaction</button>
      </main>
    </div>

    <dialog id="transaction-dialog" aria-labelledby="transaction-title">
      <form id="transaction-form">
        <div class="dialog-heading">
          <h2 id="transaction-title">Add transaction</h2>
          <button id="btn-close" class="dialog-close" type="button" aria-label="Close">×</button>
        </div>

        <label for="description">Description</label>
        <input id="description" name="descricao" type="text" maxlength="100" required />

        <div class="form-row">
          <div>
            <label for="amount">Amount (R$)</label>
            <input id="amount" name="valor" type="number" min="0.01" step="0.01" required />
          </div>
          <div>
            <label for="type">Type</label>
            <select id="type" name="tipo" required>
              <option value="despesa">Expense</option>
              <option value="receita">Income</option>
            </select>
          </div>
        </div>

        <label for="category">Category</label>
        <input id="category" name="categoria" type="text" maxlength="60" required />

        <label for="date">Date</label>
        <input id="date" name="data" type="date" required />

        <p id="form-error" class="form-error" role="alert"></p>
        <button class="form-submit" type="submit">Save transaction</button>
      </form>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
